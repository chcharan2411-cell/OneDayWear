      dockerfile: Dockerfile
    container_name: onedaywear-notification-service
    restart: unless-stopped
    depends_on:
      - discovery-server
    environment:
      PORT: 8085
      EUREKA_URL: http://discovery-server:8761/eureka/
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-chcharan2144@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-mscamecezrgorlnp}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true"
