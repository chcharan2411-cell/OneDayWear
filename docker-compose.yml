services:
  # ============================================================
  # MySQL Database Infrastructure
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: onedaywear-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Charan@33Z}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - onedaywear-network

  # ============================================================
  # Netflix Eureka Discovery Server
  # ============================================================
  discovery-server:
    build:
      context: ./backend/discovery-server
      dockerfile: Dockerfile
    container_name: onedaywear-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
      EUREKA_HOSTNAME: discovery-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    init: true
    networks:
      - onedaywear-network

  # ============================================================
  # API Gateway
  # ============================================================
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: onedaywear-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
    environment:
      PORT: 8080
      EUREKA_URL: http://discovery-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    init: true
    networks:
      - onedaywear-network

  # ============================================================
  # Auth Service
  # ============================================================
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: onedaywear-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: onedaywear_auth
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-Charan@33Z}
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-ThisIsASecretKeyForOneDayWearApplicationJWTTokenGeneration123456789}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8085}
      APP_GATEWAY_URL: ${APP_GATEWAY_URL:-http://api-gateway:8080}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/onedaywear_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true"
    init: true
    networks:
      - onedaywear-network

  # ============================================================
  # Product Service
  # ============================================================
  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: onedaywear-product-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      PORT: 8082
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: onedaywear_product
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-Charan@33Z}
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-ThisIsASecretKeyForOneDayWearApplicationJWTTokenGeneration123456789}
      FILE_UPLOAD_DIR: /app/uploads
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/onedaywear_product?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    init: true
    volumes:
      - ./uploads:/app/uploads
    networks:
      - onedaywear-network

  # ============================================================
  # Order Service
  # ============================================================
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: onedaywear-order-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    environment:
      PORT: 8083
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: onedaywear_order
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-Charan@33Z}
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-ThisIsASecretKeyForOneDayWearApplicationJWTTokenGeneration123456789}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/onedaywear_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
    init: true
    volumes:
      - ./backend/order-service/target/order-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    networks:
      - onedaywear-network

  # ============================================================
  # Payment Service
  # ============================================================
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: onedaywear-payment-service
    restart: unless-stopped
