      DB_PORT: 3306
      DB_NAME: onedaywear_payment
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-Charan@33Z}
      EUREKA_URL: http://discovery-server:8761/eureka/
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TdBVRbILFqy6UQ}
