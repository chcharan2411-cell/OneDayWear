spring.application.name=api-gateway

server.port=${PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Product Service
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/products/**

# Order Service
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/orders/**

# Payment Service
spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payments/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notifications/**

# Cart Service
spring.cloud.gateway.server.webflux.routes[5].id=cart-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/cart/**

# Wishlist Service
spring.cloud.gateway.server.webflux.routes[6].id=wishlist-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://WISHLIST-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/wishlist/**

# Review Service
spring.cloud.gateway.server.webflux.routes[7].id=review-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/reviews/**

# Inventory Service
spring.cloud.gateway.server.webflux.routes[8].id=inventory-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/inventory/**

# Admin Service
spring.cloud.gateway.server.webflux.routes[9].id=admin-service
spring.cloud.gateway.server.webflux.routes[9].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/admin/**

# Product Image
spring.cloud.gateway.server.webflux.routes[10].id=product-images
spring.cloud.gateway.server.webflux.routes[10].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/uploads/**

# CORS Configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Prevent duplicate CORS response headers
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=INFO